name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # hourly, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Keep the last forecast in case Open-Meteo is unavailable
        run: |
          curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/forecast.json" -o site/data/forecast.json \
            || echo '[]' > site/data/forecast.json

      - name: Fetch the feeds
        env:
          ENWL_API_KEY: ${{ secrets.ENWL_API_KEY }}
          SPEN_API_KEY: ${{ secrets.SPEN_API_KEY }}
        run: python scripts/refresh.py site/data scripts/ref.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
