name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # hourly, off the top of the hour
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test notification to your ntfy topic
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Keep the last update in case a feed is unavailable
        run: |
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          curl -fsS "$SITE/data/forecast.json" -o site/data/forecast.json || echo '[]' > site/data/forecast.json
          curl -fsS "$SITE/data/events.json" -o "$RUNNER_TEMP/previous-events.json" || echo '[]' > "$RUNNER_TEMP/previous-events.json"
          curl -fsS "$SITE/data/alert-state.json" -o "$RUNNER_TEMP/previous-alert-state.json" || echo '{}' > "$RUNNER_TEMP/previous-alert-state.json"

      - name: List secret names (temporary diagnostic, names only)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python -c "import json,os; print('::notice title=Secret names::' + ', '.join(sorted(k for k in json.loads(os.environ['ALL_SECRETS']) if k != 'github_token')))"

      - name: Fetch the feeds
        env:
          ENWL_API_KEY: ${{ secrets.ENWL_API_KEY }}
          SPEN_API_KEY: ${{ secrets.SPEN_API_KEY }}
        run: python scripts/refresh.py site/data scripts/ref.json "$RUNNER_TEMP/previous-events.json"

      - name: Send phone alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_POSTCODES: ${{ secrets.ALERT_POSTCODES }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TEST_ALERT: ${{ inputs.test_alert }}
        run: python scripts/alerts.py site/data "$RUNNER_TEMP/previous-alert-state.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
